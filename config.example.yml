version: 1
github:
  repository: markhuangai/opensource-repo-manager
  token: REPLACE_GITHUB_FINE_GRAINED_PAT
  webhook_secret: REPLACE_GITHUB_WEBHOOK_SECRET
pr_monitor:
  enabled: true
  requirements_source: operator
  required_checks:
    [Repository CI, CodeQL analysis, CodeQL, "AI PR review / PR #{pr}"]
  automated_reviewers:
    - { login: "chatgpt-codex-connector[bot]", signal: codex }
    - { login: "coderabbitai[bot]", signal: coderabbit }
  local_checks_only: false
proxy:
  url: http://cpa:8317/v1
  key: REPLACE_CPA_KEY
profiles:
  coding:
    sdk: claude
    model: your-claude-model-id
    # Proxy aliases require a known capability model, for example: behaves_as: claude-opus-4-8
    effort: high
  review:
    sdk: codex
    model: your-codex-model-id
    effort: high
roles:
  bootstrap:
    profile: coding
    prompts: { system: system.md, user: user.md }
    skills: [example, bootstrap]
  investigation:
    profile: coding
    prompts: { system: system.md, user: investigation.md }
    skills: [example, investigate]
  implementation:
    profile: coding
    prompts: { system: system.md, user: user.md }
    skills: [example, implement, review-feedback]
  audit:
    profile: review
    prompts: { system: system.md, user: user.md }
    skills: [example, bootstrap, audit]
  output_review:
    profile: review
    prompts: { system: system.md, user: user.md }
    skills: [example, output-review]
notifications:
  discord:
    enabled: false
    # When enabled, add webhook_url: https://discord.com/api/webhooks/ID/TOKEN
  smtp:
    enabled: false
    # When enabled, add host, port, secure, username, password, from, and to.
    # secure: true uses implicit TLS; false requires STARTTLS with certificate verification.
  webhook:
    enabled: true
    url: https://notify.example.invalid/orm
    headers:
      Authorization: Bearer REPLACE_NOTIFICATION_TOKEN
limits:
  worker_processes: 128
  worker_output_bytes: 16777216
  worker_storage_bytes: 4294967296
mcp:
  credentials: {}
  servers: {}
  # Each configured server may set review_required_tools: [store_record].
  # Omitted or empty lists skip model review; write grants still require scanning and durable dispatch.
