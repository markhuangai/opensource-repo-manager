name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: /language:${{ matrix.language }}

  result:
    name: CodeQL analysis
    needs: analyze
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: Require both language analyses
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo,
              run_id: context.runId,
              filter: "all",
              per_page: 100,
            });
            for (const language of ["actions", "javascript-typescript"]) {
              const executions = jobs.filter(job => job.name === `Analyze (${language})` &&
                job.run_attempt <= Number(process.env.GITHUB_RUN_ATTEMPT));
              const latestAttempt = Math.max(...executions.map(job => job.run_attempt));
              const matches = executions.filter(job => job.run_attempt === latestAttempt);
              if (matches.length !== 1 || matches[0].status !== "completed" || matches[0].conclusion !== "success") {
                core.setFailed(`CodeQL ${language} has no successful latest execution.`);
              }
            }
