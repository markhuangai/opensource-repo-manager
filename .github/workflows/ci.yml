name: Repository CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npm run check
      - run: docker compose config --quiet
      - name: Validate workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d "${RUNNER_TEMP}/orm-actionlint.XXXXXX")"
          trap 'find "$tool_dir" -depth -delete' EXIT
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl --fail --silent --show-error --location "$base/$archive" --output "$tool_dir/$archive"
          curl --fail --silent --show-error --location "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt" --output "$tool_dir/checksums.txt"
          cd "$tool_dir"
          awk -v archive="$archive" '$2 == archive { print }' checksums.txt > selected-checksum.txt
          test -s selected-checksum.txt
          sha256sum --check selected-checksum.txt
          tar -xzf "$archive" actionlint
          cd "$GITHUB_WORKSPACE"
          "$tool_dir/actionlint"

  containers:
    name: Container tests (${{ matrix.architecture }}, ${{ matrix.suite }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
        suite:
          - core
          - investigation
          - bootstrap
          - actions
          - implementation-candidates
          - implementation-recovery
          - implementation-monitor-repair
          - implementation-monitor-state
          - implementation-monitor-mcp
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - name: Build and test the native image
        env:
          TEST_PLATFORM: ${{ matrix.platform }}
          TEST_SUITE: ${{ matrix.suite }}
          TEST_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run test:container -- --platform "$TEST_PLATFORM" --suite "$TEST_SUITE"

  container_results:
    name: Container smoke (${{ matrix.architecture }})
    needs: containers
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require every native suite
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          TEST_ARCHITECTURE: ${{ matrix.architecture }}
        with:
          script: |
            const { containerSuites } = require(`${process.env.GITHUB_WORKSPACE}/scripts/container-suites.mjs`);
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo,
              run_id: context.runId,
              filter: "all",
              per_page: 100,
            });
            for (const suite of containerSuites) {
              const name = `Container tests (${process.env.TEST_ARCHITECTURE}, ${suite})`;
              const executions = jobs.filter(job => job.name === name &&
                job.run_attempt <= Number(process.env.GITHUB_RUN_ATTEMPT));
              const latestAttempt = Math.max(...executions.map(job => job.run_attempt));
              const matches = executions.filter(job => job.run_attempt === latestAttempt);
              if (matches.length !== 1 || matches[0].status !== "completed" || matches[0].conclusion !== "success") {
                core.setFailed(`${name} has no successful latest execution.`);
                continue;
              }
              const job = matches[0];
              core.info(JSON.stringify({
                suite,
                architecture: process.env.TEST_ARCHITECTURE,
                queue_ms: Date.parse(job.started_at) - Date.parse(job.created_at),
                execution_ms: Date.parse(job.completed_at) - Date.parse(job.started_at),
                job_url: job.html_url,
              }));
            }

  result:
    name: Repository CI
    needs: [checks, containers, container_results]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require all repository checks and architectures
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
          ARCHITECTURES_RESULT: ${{ needs.container_results.result }}
        run: |
          printf 'Repository checks: %s; container matrix: %s\n' "$CHECKS_RESULT" "$CONTAINERS_RESULT"
          test "$CHECKS_RESULT" = success
          test "$CONTAINERS_RESULT" = success
          test "$ARCHITECTURES_RESULT" = success
