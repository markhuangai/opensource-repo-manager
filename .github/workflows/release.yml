name: Release prerelease
run-name: Prerelease ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: [Repository CI, CodeQL]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: prerelease-${{ github.repository }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/markhuangai/opensource-repo-manager

jobs:
  resolve:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.id == github.repository_id
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-state-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      release_id: ${{ steps.release.outputs.release_id }}
      build_required: ${{ steps.release.outputs.build_required }}
      publish_required: ${{ steps.release.outputs.publish_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve and reserve candidate
        id: release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { resolveCandidate } = require(`${process.env.GITHUB_WORKSPACE}/scripts/release-policy.mjs`);
            await resolveCandidate({ github, context, core, env: process.env });

  build:
    name: Release image (${{ matrix.architecture }})
    needs: resolve
    if: needs.resolve.outputs.build_required == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
      - name: Verify the immutable checkout
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push by digest
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/markhuangai/opensource-repo-manager
            org.opencontainers.image.revision=${{ needs.resolve.outputs.source_sha }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
      - name: Smoke-test the published native image
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        with:
          script: |
            const assert = require("node:assert/strict");
            const { writeFile } = require("node:fs/promises");
            const { join } = require("node:path");
            const { IMAGE, IMAGE_DIGEST, PLATFORM, SOURCE_SHA, VERSION, RUNNER_TEMP } = process.env;
            const started = Date.now();
            core.info(JSON.stringify({event: "release.smoke.started", repository: `${context.repo.owner}/${context.repo.repo}`, run_id: context.runId,
              attempt: process.env.GITHUB_RUN_ATTEMPT, stage: "smoke", source_sha: SOURCE_SHA,
              version: VERSION, platform: PLATFORM, digest: IMAGE_DIGEST}));
            try {
            assert(/^sha256:[0-9a-f]{64}$/.test(IMAGE_DIGEST), "Invalid build digest.");
            const architecture = PLATFORM.split("/")[1];
            const reference = `${IMAGE}@${IMAGE_DIGEST}`;
            await exec.exec("docker", ["pull", "--platform", PLATFORM, reference]);
            const inspected = JSON.parse((await exec.getExecOutput("docker", ["image", "inspect", reference], { silent: true })).stdout)[0];
            assert.equal(`${inspected.Os}/${inspected.Architecture}`, PLATFORM);
            assert.equal(inspected.Config.Labels["org.opencontainers.image.revision"], SOURCE_SHA);
            assert.equal(inspected.Config.Labels["org.opencontainers.image.version"], VERSION);
            assert.deepEqual(inspected.Config.Entrypoint, ["/usr/bin/tini", "--", "/opt/orm-runtime/bin/node", "/opt/orm/app/dist/actions/main.js"]);
            assert(!inspected.Config.Healthcheck && !inspected.Config.ExposedPorts);
            const name = `orm-release-smoke-${require("node:crypto").randomUUID()}`;
            const label = "org.opensource-repo-manager.release-smoke";
            try {
              const bounded = await exec.getExecOutput("timeout", ["--kill-after=15s", "30s", "docker", "run", "--rm",
                "--name", name, "--label", `${label}=${name}`, "--network", "none", "--platform", PLATFORM, reference, "1"],
                { silent: true, ignoreReturnCode: true });
              assert.equal(bounded.exitCode, 1, "Default entrypoint must fail promptly without credentials.");
              assert.deepEqual(JSON.parse(bounded.stdout.trim()), { version: 1, outcome: "failed", reason: "configuration_invalid" });
            } finally {
              const remaining = await exec.getExecOutput("docker", ["container", "inspect", name], { silent: true, ignoreReturnCode: true });
              if (remaining.exitCode === 0) {
                const container = JSON.parse(remaining.stdout)[0];
                assert.equal(container.Config.Labels[label], name, "Smoke container ownership changed.");
                await exec.exec("docker", ["container", "rm", "--force", container.Id]);
              }
            }
            await exec.exec("docker", ["run", "--rm", "--network", "none", "--platform", PLATFORM,
              "--entrypoint", "/opt/orm-runtime/bin/node", reference, "-e",
              `const assert = require('node:assert/strict'); assert.equal(process.arch, '${architecture === "amd64" ? "x64" : "arm64"}'); const db = require('better-sqlite3')(':memory:'); assert.equal(db.prepare('SELECT 1 AS value').get().value, 1); db.close();`]);
            for (const binary of ["mise", "gitleaks"]) {
              await exec.exec("docker", ["run", "--rm", "--network", "none", "--platform", PLATFORM,
                "--entrypoint", `/opt/orm-runtime/bin/${binary}`, reference, "--version"]);
            }
            const manifest = JSON.parse((await exec.getExecOutput("docker",
              ["buildx", "imagetools", "inspect", reference, "--format", "{{json .Manifest}}"], { silent: true })).stdout);
            const candidates = manifest.manifests?.filter(item => item.platform?.os === "linux" && item.platform?.architecture === architecture);
            assert(!candidates || candidates.length === 1, "Missing or duplicate native manifest.");
            const platformDigest = candidates ? candidates[0].digest : manifest.digest;
            assert(/^sha256:[0-9a-f]{64}$/.test(platformDigest), "Invalid native manifest digest.");
            await writeFile(join(RUNNER_TEMP, `image-${architecture}.json`), JSON.stringify({
              source_sha: SOURCE_SHA, version: VERSION, platform: PLATFORM,
              digest: IMAGE_DIGEST, platform_digest: platformDigest, smoke: "passed",
            }));
            core.info(JSON.stringify({event: "release.smoke.finished", repository: `${context.repo.owner}/${context.repo.repo}`, run_id: context.runId,
              stage: "smoke", source_sha: SOURCE_SHA, version: VERSION, platform: PLATFORM,
              digest: IMAGE_DIGEST, platform_digest: platformDigest, elapsed_ms: Date.now() - started, outcome: "passed"}));
            } catch (error) {
              core.error(JSON.stringify({event: "release.smoke.failed", repository: `${context.repo.owner}/${context.repo.repo}`, run_id: context.runId,
                attempt: process.env.GITHUB_RUN_ATTEMPT, stage: "smoke", source_sha: SOURCE_SHA,
                version: VERSION, platform: PLATFORM, digest: IMAGE_DIGEST,
                elapsed_ms: Date.now() - started, cause: error.message,
                recovery: "Inspect the native build and failed assertion; correct the cause before rerunning this candidate."}));
              throw error;
            }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.architecture }}
          path: ${{ runner.temp }}/image-${{ matrix.architecture }}.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [resolve, build]
    if: >-
      always() && needs.resolve.result == 'success' &&
      needs.resolve.outputs.publish_required == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-state-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.resolve.outputs.build_required == 'true'
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Publish verified candidate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_ID: ${{ needs.resolve.outputs.release_id }}
          RECEIPTS: ${{ runner.temp }}/digests
        with:
          script: |
            const { publishCandidate } = require(`${process.env.GITHUB_WORKSPACE}/scripts/release-policy.mjs`);
            await publishCandidate({ github, context, core, exec, env: process.env });
