name: Test AI configuration

on:
  workflow_call:
    inputs:
      runtime-image:
        description: Optional immutable runtime override; defaults to this workflow release's image
        required: false
        default: ""
        type: string
      runner:
        description: Compatible Linux AMD64 or ARM64 Docker runner label
        default: ubuntu-24.04
        type: string
      role:
        description: Configured role whose profile should receive one test prompt
        default: implementation
        type: string
    secrets:
      ORM_CONFIGURATION_VARIABLES:
        description: JSON of the caller vars context
        required: true
      ORM_CONFIGURATION_SECRETS:
        description: JSON map of explicitly forwarded repository secrets
        required: true

permissions:
  contents: read

jobs:
  runtime:
    name: Select compatible runtime
    permissions:
      contents: read
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    outputs:
      runtime-image: ${{ steps.runtime.outputs.runtime-image }}
    steps:
      - name: Resolve the workflow runtime
        id: runtime
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ORM_RUNTIME_IMAGE: ${{ inputs.runtime-image }}
          # actionlint 1.7.12 predates the job.workflow_* identity fields.
          ORM_WORKFLOW_JOB: ${{ toJSON(job) }}
        with:
          script: |
            const assert = require("node:assert/strict");
            const { StringDecoder } = require("node:string_decoder");
            const started = Date.now(), input = process.env.ORM_RUNTIME_IMAGE ?? "";
            const repository = "markhuangai/opensource-repo-manager";
            const imageRepository = `ghcr.io/${repository}`;
            const digest = value => typeof value === "string" && /^sha256:[a-f0-9]{64}$/.test(value) && value.length === 71;
            const common = {repository: `${context.repo.owner}/${context.repo.repo}`,
              run_id: context.runId, attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              job: process.env.GITHUB_JOB, mode: input === "" ? "default" : "override", timeout_ms: 60000};
            let stage = "input", reference, observed, lastApi;
            const credential = core.getInput?.("github-token") ?? "";
            const credentialField = /^(authorization|proxy-authorization|cookie|set-cookie|token|access_token|refresh_token|(?:x[-_]?)?api[-_]?key|password|secret|signed(upload|download)?url|signature|sig)$/i;
            const protectedTextPattern = new RegExp(/"(?:\\[\s\S]?|[^"\\])*(?:"|$)/.source + "|((?:^|[\\s(,{;])" + credentialField.source.slice(1,-1) + "[ \\t]*[:=][ \\t]*)[^\\r\\n]*", "gim");
            const protectUrls = text => text.replace(/https?:(?:\/|\\\/){2}[^\s"'<>]+/gi, url => {
              try { const parsed = new URL(url.replaceAll("\\/", "/").replaceAll("&amp;", "&"));
                if (parsed.username || parsed.password || [...parsed.searchParams.keys()].some(key => credentialField.test(key) || /^(client_secret|x-amz-|x-goog-)/i.test(key))) return "[signed URL excluded]";
              } catch {}
              return url;
            });
            const excludeFields = value => {
              const keys = /("(?:\\.|[^"\\])*")\s*:\s*/g;
              let output = "", previous = 0, match;
              while ((match = keys.exec(value))) {
                try { if (!credentialField.test(JSON.parse(match[1]))) continue; } catch { continue; }
                let depth = 0, quoted = false, escaped = false, end = keys.lastIndex;
                for (; end < value.length; end++) {
                  const character = value[end];
                  if (quoted) {
                    if (escaped) escaped = false;
                    else if (character === "\\") escaped = true;
                    else if (character === '"') { quoted = false; if (!depth) { end++; break; } }
                  } else if (character === '"') quoted = true;
                  else if (character === "[" || character === "{") depth++;
                  else if (character === "]" || character === "}") { if (!depth) break; if (!--depth) { end++; break; } }
                  else if (!depth && (character === "," || /\s/.test(character))) break;
                }
                output += value.slice(previous, keys.lastIndex) + '"[credential excluded]"';
                previous = end; keys.lastIndex = end;
              }
              return output + value.slice(previous);
            };
            const protectTail = safe => {
              let excluded = 0;
              for (const secret of [credential, JSON.stringify(credential).slice(1,-1)].filter(Boolean))
                for (let size = Math.min(secret.length - 1, safe.length); size > excluded; size--)
                  if (safe.endsWith(secret.slice(0,size))) { excluded = size; break; }
              return excluded ? safe.slice(0,-excluded) + "[credential prefix excluded]" : safe;
            };
            const decodeQuoted = (quoted, protectIncomplete) => {
              try { return JSON.parse(quoted); }
              catch {
                try { return protectIncomplete(JSON.parse(quoted + '"')); }
                catch {
                  const closed = quoted.length > 1 && /(?:^|[^\\])(?:\\\\)*"$/.test(quoted);
                  const content = quoted.slice(1,closed ? -1 : undefined), parts = [];
                  let decoded = "";
                  for (const [token] of content.matchAll(/\\(?:u[0-9a-fA-F]{4}|["\\/bfnrt])|\\(?:u[0-9a-fA-F]{0,3}(?=$)|[\s\S]?)|[^\\]+/g)) {
                    if (/^\\(?:u[0-9a-fA-F]{4}|["\\/bfnrt])$/.test(token)) decoded += JSON.parse('"' + token + '"');
                    else if (token.startsWith("\\")) { parts.push(protectIncomplete(decoded),token); decoded = ""; }
                    else decoded += token;
                  }
                  parts.push(protectIncomplete(decoded));
                  return parts.join("");
                }
              }
            };
            const protectText = value => {
              const redact = text => credential ? text.replaceAll(credential, "[credential excluded]") : text;
              const text = excludeFields(value).replace(protectedTextPattern, (quoted,prefix) => {
                if (prefix !== undefined) return prefix + "[credential excluded]";
                const closed = quoted.length > 1 && quoted.endsWith('"');
                let protectedPrefix = false;
                const decoded = decodeQuoted(quoted,text => {
                  const safe = protectTail(text); protectedPrefix ||= safe !== text; return safe;
                }), safe = protectText(decoded);
                if (safe === decoded && !protectedPrefix) return quoted;
                const encoded = JSON.stringify(safe);
                return closed ? encoded : encoded.slice(0,-1);
              });
              return redact(protectUrls(text));
            };
            const scrub = value => {
              if (Array.isArray(value)) return `[${value.map(scrub).join(",")}]`;
              if (value && typeof value === "object") return `{${Object.entries(value).map(([key,item]) =>
                `${JSON.stringify(protectText(key))}:${credentialField.test(key) ? '"[credential excluded]"' : scrub(item)}`).join(",")}}`;
              return JSON.stringify(typeof value === "string" ? protectText(value) : value);
            };
            const protect = (value, incomplete = false) => {
              const text = typeof value === "string" ? value : JSON.stringify(value);
              let safe;
              try { safe = scrub(JSON.parse(text)); } catch { safe = protectText(text ?? ""); }
              if (incomplete) safe = protectTail(safe);
              return safe;
            };
            const capture = (value, limit) => {
              const bytes = Buffer.from(protect(value ?? ""));
              const content = new StringDecoder("utf8").write(bytes.subarray(0, limit));
              return {content, bytes: bytes.length, omitted_bytes: bytes.length - Buffer.byteLength(content)};
            };
            const log = (event, fields = {}) => core.info(JSON.stringify({event: `runtime.${event}`,
              level: "info", ...common, stage, elapsed_ms: Date.now() - started, ...fields}));
            const cause = (error, seen = new Set()) => {
              if (!error || typeof error !== "object") return {message: String(error)};
              if (seen.has(error)) return {message: "Circular error cause"};
              seen.add(error);
              return {name: error.name, message: error.message, code: error.code,
                errors: Array.isArray(error.errors) ? error.errors.map(item => cause(item, seen)) : undefined,
                cause: error.cause === undefined ? undefined : cause(error.cause, seen)};
            };
            const detail = (metadata, kind, value, captureState = {}) => {
              if (value === undefined) return;
              const incomplete = captureState.capture_state && captureState.capture_state !== "complete" && captureState.capture_state !== "empty";
              const bytes = Buffer.from(protect(value, incomplete)), limit = 1024 * 1024;
              const content = new StringDecoder("utf8").write(bytes.subarray(0, limit));
              let offset = 0, part = 0;
              do {
                let end = Math.min(content.length, offset + 512);
                if (end > offset && /[\uD800-\uDBFF]/.test(content[end - 1])) end--;
                let record = {event: "api.response.detail", level: "error", ...metadata,
                  detail_kind: kind, part: ++part, content: content.slice(offset, end), last: end === content.length,
                  body_bytes: bytes.length, ...captureState,
                  omitted_bytes: captureState.omitted_bytes === -1 ? -1 : bytes.length - Buffer.byteLength(content) + (typeof captureState.omitted_bytes === "number" ? captureState.omitted_bytes : 0),
                  capture_state: incomplete ? captureState.capture_state : bytes.length > limit ? "byte_limit" : (captureState.capture_state ?? "complete")};
                while (Buffer.byteLength(JSON.stringify(record)) > 2048 && end > offset) {
                  end = offset + Math.floor((end - offset) / 2);
                  if (end > offset && /[\uD800-\uDBFF]/.test(content[end - 1])) end--;
                  record = {...record, content: content.slice(offset, end), last: end === content.length};
                }
                core.error(JSON.stringify(record));
                offset = end;
              } while (offset < content.length);
            };
            const apiCall = async (operation, invoke, provider = "github") => {
              const requestId = require("node:crypto").randomUUID(), began = Date.now();
              const metadata = {provider, operation, request_id: requestId,
                repository: common.repository, target_repository: repository,
                credential_source: provider === "github" ? "workflow.token" : undefined,
                method: provider === "github" ? operation.split(" ")[0] : undefined,
                route: provider === "github" ? operation.slice(operation.indexOf(" ") + 1) : undefined,
                workflow_run_id: common.run_id, run_attempt: common.attempt, workflow_sha: common.workflow_sha};
              lastApi = {metadata, failed: false};
              const failed = (error, response = {}) => {
                if (lastApi.failed) return;
                Object.assign(lastApi, {failed:true, status:response.status, exit_code:response.exit_code});
                core.error(JSON.stringify({event:"api.request.failed",level:"error",...metadata,
                  status:response.status,error_status:error.status,exit_code:response.exit_code,
                  response_received:response.status !== undefined,elapsed_ms:Date.now()-began}));
                detail(metadata,"cause",cause(error));
                detail(metadata,"body",response.body,response.capture);
                if (response.readError) detail(metadata,"read_cause",cause(response.readError));
                const headers = typeof response.headers?.entries === "function" ? Object.fromEntries(response.headers.entries()) : response.headers ?? {};
                detail(metadata,"headers",Object.fromEntries(Object.entries(headers).filter(([name]) =>
                  /^(x-github-request-id|x-request-id|x-accepted-github-permissions|x-ratelimit-(limit|remaining|reset)|retry-after)$/.test(name))));
              };
              const observedFetch = async (input, init) => {
                const baseFetch = github.request?.endpoint?.DEFAULTS?.request?.fetch ?? fetch;
                const response = await baseFetch(input,init);
                core.info(JSON.stringify({event:"api.response.started",level:"info",...metadata,status:response.status,elapsed_ms:Date.now()-began}));
                if (response.status < 400) return response;
                const reader = response.clone().body?.getReader(), chunks = [];
                let size = 0, state = "complete", readError;
                const timeout = AbortSignal.timeout(5000);
                const signal = init?.signal ? AbortSignal.any([init.signal,timeout]) : timeout;
                const stop = () => { void reader?.cancel().catch(() => {}); };
                signal.addEventListener("abort",stop,{once:true});
                try {
                  while (reader && !signal.aborted) {
                    const value = await reader.read();
                    if (value.done) break;
                    const remaining = 1024*1024-size;
                    chunks.push(value.value.subarray(0,Math.max(0,remaining)));
                    size += Math.min(remaining,value.value.length);
                    if (value.value.length > remaining) {state="byte_limit";break;}
                  }
                  if (signal.aborted) {state=timeout.aborted?"read_timeout":"cancelled";readError=signal.reason;}
                } catch (error) {state="read_failed";readError=error;}
                finally {signal.removeEventListener("abort",stop);void reader?.cancel().catch(() => {});}
                const body = new StringDecoder("utf8").write(Buffer.concat(chunks));
                failed(new Error(response.statusText),{status:response.status,headers:response.headers,body,readError,
                  capture:{capture_state:state,...(state!=="complete" && {omitted_bytes:-1})}});
                return response;
              };
              core.info(JSON.stringify({event:"api.request.started",level:"info",...metadata}));
              try {
                const response = await invoke(observedFetch);
                Object.assign(lastApi,{status:response.status,exit_code:response.exitCode});
                if (response.exitCode) {
                  failed(new Error(response.exitCode===124 || response.exitCode===137 ? "Registry inspection timed out." : "Registry inspection failed."),{exit_code:response.exitCode,body:response.stderr});
                  return response;
                }
                core.info(JSON.stringify({event:"api.request.finished",level:"info",...metadata,
                  status:response.status,exit_code:response.exitCode,elapsed_ms:Date.now()-began}));
                return response;
              } catch (error) {
                failed(error,{status:error.response?.status,headers:error.response?.headers,body:error.response?.data});
                throw error;
              }
            };
            try {
              log("started");
              if (input !== "") {
                assert(/^[a-z0-9][a-z0-9.-]*(?::[0-9]+)?(?:\/[a-z0-9][a-z0-9._-]*)+@sha256:[a-f0-9]{64}$/.test(input),
                  "runtime-image must be pinned by digest.");
                log("resolved", {runtime_image: input});
                core.setOutput("runtime-image", input);
                return;
              }
              stage = "identity";
              let identity;
              try { identity = JSON.parse(process.env.ORM_WORKFLOW_JOB); }
              catch { throw new Error("Called workflow identity is unavailable."); }
              assert(identity?.workflow_repository === repository &&
                identity.workflow_file_path === ".github/workflows/test-ai.yml" &&
                typeof identity.workflow_ref === "string" &&
                identity.workflow_ref.startsWith(`${repository}/.github/workflows/test-ai.yml@`) &&
                typeof identity.workflow_sha === "string" && /^[a-f0-9]{40}$/.test(identity.workflow_sha) &&
                identity.workflow_sha.length === 40, "Called ORM workflow identity is unavailable or invalid.");
              Object.assign(common, {workflow_repository: identity.workflow_repository,
                workflow_ref: identity.workflow_ref, workflow_sha: identity.workflow_sha,
                check_run_id: identity.check_run_id});
              stage = "revision";
              const [owner, repo] = repository.split("/");
              const request = {signal: AbortSignal.timeout(common.timeout_ms)};
              let revision, workflowObjectType = "tag";
              try {
                revision = await apiCall("GET /repos/{owner}/{repo}/git/tags/{tag_sha}", fetch => github.rest.git.getTag({owner, repo, tag_sha: identity.workflow_sha, request:{...request,fetch}}));
              } catch (error) {
                if (error.status !== 404) throw error;
                workflowObjectType = "commit";
                revision = await apiCall("GET /repos/{owner}/{repo}/git/commits/{commit_sha}", fetch => github.rest.git.getCommit({owner, repo, commit_sha: identity.workflow_sha, request:{...request,fetch}}));
              }
              const object = revision?.data;
              const sourceSha = workflowObjectType === "tag" ? object?.object?.sha : object?.sha;
              observed = {revision_capture: capture(JSON.stringify({sha: object?.sha,
                target_type: object?.object?.type, target_sha: object?.object?.sha}), 16 * 1024)};
              assert(object?.sha === identity.workflow_sha &&
                (workflowObjectType === "commit" || object?.object?.type === "commit") &&
                typeof sourceSha === "string" && /^[a-f0-9]{40}$/.test(sourceSha) && sourceSha.length === 40,
                "Workflow revision must resolve to its captured commit or a direct commit-target tag.");
              Object.assign(common, {source_sha: sourceSha, workflow_object_type: workflowObjectType});
              log("revision", {observed});
              stage = "registry";
              observed = undefined;
              reference = `${imageRepository}:sha-${sourceSha}`;
              log("lookup", {reference});
              const result = await apiCall("docker buildx imagetools inspect", () => exec.getExecOutput("timeout", ["--kill-after=5s", "60s", "docker",
                "buildx", "imagetools", "inspect", reference, "--format", "{{json .Manifest}}"],
                {silent: true, ignoreReturnCode: true}), "registry");
              assert(result.exitCode === 0, result.exitCode === 124 || result.exitCode === 137 ?
                "Registry inspection timed out." : "Registry inspection failed.");
              stage = "manifest";
              const manifestCapture = capture(result.stdout, 64 * 1024);
              const manifestBytes = Buffer.byteLength(result.stdout);
              observed = {manifest_bytes: manifestBytes, manifest_capture: manifestCapture};
              assert(manifestBytes <= 64 * 1024, "Registry manifest exceeds the 64 KiB capture limit.");
              let manifest;
              try { manifest = JSON.parse(result.stdout); }
              catch { throw new Error("Registry returned invalid manifest JSON."); }
              log("manifest", {reference, digest: manifest?.digest, manifest_bytes: Buffer.byteLength(result.stdout)});
              stage = "proof";
              let proof;
              try { proof = JSON.parse(manifest?.annotations?.["org.opensource-repo-manager.publication"] ?? "null"); }
              catch { throw new Error("Image publication proof is invalid JSON."); }
              observed = {digest: manifest?.digest, proof};
              assert(digest(manifest?.digest) && proof?.version === 2 &&
                proof.source_sha === sourceSha, "Image publication proof does not match the workflow source.");
              const version = typeof proof.release_version === "string" &&
                proof.release_version.match(/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-rc\.([1-9][0-9]*))?$/);
              assert(version && version[0] === proof.release_version &&
                version.slice(1).every(part => part === undefined || Number.isSafeInteger(Number(part))),
                "Image publication version is invalid.");
              assert(Array.isArray(proof.platforms) && proof.platforms.length === 2 &&
                proof.platforms[0]?.platform === "linux/amd64" && proof.platforms[1]?.platform === "linux/arm64" &&
                proof.platforms.every(item => digest(item.platform_digest)), "Both native platform proofs are required.");
              assert(Array.isArray(manifest.manifests) &&
                manifest.manifests.every(item => item && typeof item === "object"), "A combined image index is required.");
              const runnable = manifest.manifests.filter(item =>
                item.annotations?.["vnd.docker.reference.type"] !== "attestation-manifest")
                .map(item => ({platform: `${item.platform?.os}/${item.platform?.architecture}`,
                  platform_digest: item.digest})).sort((a, b) => a.platform.localeCompare(b.platform));
              assert.deepEqual(runnable, proof.platforms, "Manifest differs from the smoke-tested platforms.");
              const image = `${imageRepository}@${manifest.digest}`;
              log("resolved", {reference, runtime_image: image, release_version: proof.release_version, platforms: proof.platforms});
              core.setOutput("runtime-image", image);
            } catch (error) {
              const recovery = stage === "input" ? "Supply runtime-image as an immutable @sha256: reference." :
                stage === "identity" ? "Use a released ORM workflow on GitHub.com, or supply a compatible explicit runtime-image digest." :
                stage === "revision" ? "Verify GitHub access and the captured ORM tag/commit object; use a published direct commit-target tag or a compatible explicit digest." :
                stage === "registry" ? "Verify GHCR access and publication for this workflow commit; wait for its release or supply a compatible explicit digest." :
                "Inspect the public manifest and publication proof; use a matching workflow/image pair or correct the trusted publication.";
              const metadata = lastApi?.metadata ?? {provider:"runtime",operation:stage,
                request_id:require("node:crypto").randomUUID(),repository:common.repository,
                workflow_run_id:common.run_id,run_attempt:common.attempt};
              if (!lastApi?.failed) {
                detail(metadata,"cause",cause(error));
                detail(metadata,"observed",observed);
              }
              core.setFailed(JSON.stringify({event:"runtime.failed",level:"error",...common,stage,reference,
                request_id:metadata.request_id,
                expected:{source_sha:common.source_sha,proof_version:2,platforms:["linux/amd64","linux/arm64"]},
                provider_status:lastApi?.status,exit_code:lastApi?.exit_code,
                cause_code:lastApi?.failed?"provider_failed":error.code==="ERR_ASSERTION"?"assertion_failed":"runtime_selection_failed",
                elapsed_ms:Date.now()-started,recovery}));
            }

  test:
    name: Test configured AI profile
    needs: runtime
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      - name: Test one AI response
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ORM_RUNTIME_IMAGE: ${{ needs.runtime.outputs.runtime-image }}
          ORM_TEST_ROLE: ${{ inputs.role }}
          ORM_BOOTSTRAP_GITHUB_TOKEN: ${{ github.token }}
          ORM_CONFIGURATION_SECRETS: ${{ secrets.ORM_CONFIGURATION_SECRETS }}
          ORM_CONFIGURATION_VARIABLES: ${{ secrets.ORM_CONFIGURATION_VARIABLES }}
        with:
          script: |
            const assert = require("node:assert/strict");
            assert(context.eventName === "workflow_dispatch", "AI tests require a manual caller.");
            assert(context.ref === `refs/heads/${context.payload.repository.default_branch}`, "Run the caller from its default branch.");
            const image = process.env.ORM_RUNTIME_IMAGE, role = process.env.ORM_TEST_ROLE;
            assert(/^[a-z0-9][a-z0-9.-]*(?::[0-9]+)?(?:\/[a-z0-9][a-z0-9._-]*)+@sha256:[a-f0-9]{64}$/.test(image), "runtime-image must be pinned by digest.");
            assert(["bootstrap", "investigation", "implementation", "audit", "output_review"].includes(role), "Unknown configured role.");
            core.info(JSON.stringify({event: "runtime.used", level: "info", repository: process.env.GITHUB_REPOSITORY,
              run_id: context.runId, attempt: Number(process.env.GITHUB_RUN_ATTEMPT), job: process.env.GITHUB_JOB,
              operation: "test-ai", role, runtime_image: image}));
            const name = `orm-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}-ai-test`;
            await exec.exec("docker", ["pull", image]);
            const environment = ["ORM_BOOTSTRAP_GITHUB_TOKEN", "ORM_CONFIGURATION_SECRETS", "ORM_CONFIGURATION_VARIABLES",
              "GITHUB_REPOSITORY", "GITHUB_REPOSITORY_ID", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_EVENT_NAME", "GITHUB_REF"];
            await exec.exec("docker", ["create", "--name", name,
              "--label", `org.opensource-repo-manager.ai-test=${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`,
              ...environment.flatMap(key => ["--env", key]),
              "--entrypoint", "/usr/bin/tini", image, "--", "/opt/orm-runtime/bin/node", "/opt/orm/app/dist/actions/controller.js", "test-ai", role]);
            const decoder = new (require("node:string_decoder").StringDecoder)("utf8");
            let pending = "";
            const forward = chunk => {
              pending += decoder.write(chunk);
              let end;
              while ((end = pending.indexOf("\n")) !== -1) {
                core.info(pending.slice(0, end));
                pending = pending.slice(end + 1);
              }
            };
            const output = await exec.getExecOutput("docker", ["start", "--attach", name], {
              silent: true, ignoreReturnCode: true, listeners: {stderr: forward},
            });
            pending += decoder.end();
            if (pending) core.info(pending);
            const result = JSON.parse(output.stdout.trim());
            assert(result.version === 1 && ["completed", "failed"].includes(result.outcome), "Missing bounded AI test result.");
            await core.summary.addHeading("AI configuration test").addCodeBlock(JSON.stringify({ ...result, runtime_image: image }, null, 2), "json").write();
            if (output.exitCode || result.outcome !== "completed" || result.cleanup !== "passed") core.setFailed(`AI test stopped: ${result.reason}`);
      - name: Remove the AI test container
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const assert = require("node:assert/strict");
            const name = `orm-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}-ai-test`;
            const inspected = await exec.getExecOutput("docker", ["inspect", "--format",
              '{{index .Config.Labels "org.opensource-repo-manager.ai-test"}}', name], {silent: true, ignoreReturnCode: true});
            if (inspected.exitCode && /No such (object|container)/i.test(inspected.stderr)) return;
            assert(!inspected.exitCode && inspected.stdout.trim() === `${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`, "AI test container ownership is unverified.");
            await exec.exec("docker", ["stop", "--time", "15", name]);
            await exec.exec("docker", ["rm", "--volumes", name]);
            core.info(JSON.stringify({container: name, cleanup: "passed"}));
