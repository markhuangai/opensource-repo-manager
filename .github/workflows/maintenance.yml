name: Bounded maintenance

on:
  workflow_call:
    inputs:
      runtime-image:
        description: Optional immutable runtime override; defaults to this workflow release's image
        required: false
        default: ""
        type: string
      runner:
        description: Compatible Linux AMD64 or ARM64 Docker runner label
        default: ubuntu-24.04
        type: string
      issue-number:
        description: Issue selected by a maintainer through workflow_dispatch
        default: ""
        type: string
    secrets:
      ORM_CONFIGURATION_VARIABLES:
        description: JSON of the caller vars context, transported as a secret to suppress runner metadata
        required: true
      ORM_CONFIGURATION_SECRETS:
        description: JSON map of explicitly forwarded repository secrets
        required: true

permissions:
  contents: read
  actions: read

jobs:
  runtime:
    name: Select compatible runtime
    permissions:
      contents: read
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    outputs:
      runtime-image: ${{ steps.runtime.outputs.runtime-image }}
    steps:
      - name: Resolve the workflow runtime
        id: runtime
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ORM_RUNTIME_IMAGE: ${{ inputs.runtime-image }}
          # actionlint 1.7.12 predates the job.workflow_* identity fields.
          ORM_WORKFLOW_JOB: ${{ toJSON(job) }}
        with:
          script: |
            const assert = require("node:assert/strict");
            const { StringDecoder } = require("node:string_decoder");
            const started = Date.now(), input = process.env.ORM_RUNTIME_IMAGE ?? "";
            const repository = "markhuangai/opensource-repo-manager";
            const imageRepository = `ghcr.io/${repository}`;
            const digest = value => typeof value === "string" && /^sha256:[a-f0-9]{64}$/.test(value) && value.length === 71;
            const common = {repository: `${context.repo.owner}/${context.repo.repo}`,
              run_id: context.runId, attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              job: process.env.GITHUB_JOB, mode: input === "" ? "default" : "override", timeout_ms: 60000};
            let stage = "input", reference, observed, providerStatus, providerError;
            const capture = (value, limit) => {
              const bytes = Buffer.from(value ?? "");
              const content = new StringDecoder("utf8").write(bytes.subarray(0, limit));
              return {content, bytes: bytes.length, omitted_bytes: bytes.length - Buffer.byteLength(content)};
            };
            const log = (event, fields = {}) => core.info(JSON.stringify({event: `runtime.${event}`,
              level: "info", ...common, stage, elapsed_ms: Date.now() - started, ...fields}));
            try {
              log("started");
              if (input !== "") {
                assert(/^[a-z0-9][a-z0-9.-]*(?::[0-9]+)?(?:\/[a-z0-9][a-z0-9._-]*)+@sha256:[a-f0-9]{64}$/.test(input),
                  "runtime-image must be pinned by digest.");
                log("resolved", {runtime_image: input});
                core.setOutput("runtime-image", input);
                return;
              }
              stage = "identity";
              let identity;
              try { identity = JSON.parse(process.env.ORM_WORKFLOW_JOB); }
              catch { throw new Error("Called workflow identity is unavailable."); }
              assert(identity?.workflow_repository === repository &&
                identity.workflow_file_path === ".github/workflows/maintenance.yml" &&
                typeof identity.workflow_ref === "string" &&
                identity.workflow_ref.startsWith(`${repository}/.github/workflows/maintenance.yml@`) &&
                typeof identity.workflow_sha === "string" && /^[a-f0-9]{40}$/.test(identity.workflow_sha) &&
                identity.workflow_sha.length === 40, "Called ORM workflow identity is unavailable or invalid.");
              Object.assign(common, {workflow_repository: identity.workflow_repository,
                workflow_ref: identity.workflow_ref, workflow_sha: identity.workflow_sha,
                check_run_id: identity.check_run_id});
              stage = "registry";
              reference = `${imageRepository}:sha-${identity.workflow_sha}`;
              log("lookup", {reference});
              const result = await exec.getExecOutput("timeout", ["--kill-after=5s", "60s", "docker",
                "buildx", "imagetools", "inspect", reference, "--format", "{{json .Manifest}}"],
                {silent: true, ignoreReturnCode: true});
              providerStatus = result.exitCode;
              providerError = capture(result.stderr, 16 * 1024);
              assert(result.exitCode === 0, result.exitCode === 124 || result.exitCode === 137 ?
                "Registry inspection timed out." : "Registry inspection failed.");
              stage = "manifest";
              const manifestCapture = capture(result.stdout, 64 * 1024);
              observed = {manifest_capture: manifestCapture};
              assert(manifestCapture.omitted_bytes === 0, "Registry manifest exceeds the 64 KiB capture limit.");
              let manifest;
              try { manifest = JSON.parse(result.stdout); }
              catch { throw new Error("Registry returned invalid manifest JSON."); }
              log("manifest", {reference, manifest});
              stage = "proof";
              let proof;
              try { proof = JSON.parse(manifest?.annotations?.["org.opensource-repo-manager.publication"] ?? "null"); }
              catch { throw new Error("Image publication proof is invalid JSON."); }
              observed = {digest: manifest?.digest, proof};
              assert(digest(manifest?.digest) && proof?.version === 2 &&
                proof.source_sha === identity.workflow_sha, "Image publication proof does not match the workflow source.");
              const version = typeof proof.release_version === "string" &&
                proof.release_version.match(/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-rc\.([1-9][0-9]*))?$/);
              assert(version && version[0] === proof.release_version &&
                version.slice(1).every(part => part === undefined || Number.isSafeInteger(Number(part))),
                "Image publication version is invalid.");
              assert(Array.isArray(proof.platforms) && proof.platforms.length === 2 &&
                proof.platforms[0]?.platform === "linux/amd64" && proof.platforms[1]?.platform === "linux/arm64" &&
                proof.platforms.every(item => digest(item.platform_digest)), "Both native platform proofs are required.");
              assert(Array.isArray(manifest.manifests) &&
                manifest.manifests.every(item => item && typeof item === "object"), "A combined image index is required.");
              const runnable = manifest.manifests.filter(item =>
                item.annotations?.["vnd.docker.reference.type"] !== "attestation-manifest")
                .map(item => ({platform: `${item.platform?.os}/${item.platform?.architecture}`,
                  platform_digest: item.digest})).sort((a, b) => a.platform.localeCompare(b.platform));
              assert.deepEqual(runnable, proof.platforms, "Manifest differs from the smoke-tested platforms.");
              const image = `${imageRepository}@${manifest.digest}`;
              log("resolved", {reference, runtime_image: image, release_version: proof.release_version, platforms: proof.platforms});
              core.setOutput("runtime-image", image);
            } catch (error) {
              const recovery = stage === "input" ? "Supply runtime-image as an immutable @sha256: reference." :
                stage === "identity" ? "Use a released ORM workflow on GitHub.com, or supply a compatible explicit runtime-image digest." :
                stage === "registry" ? "Verify GHCR access and publication for this workflow commit; wait for its release or supply a compatible explicit digest." :
                "Inspect the public manifest and publication proof; use a matching workflow/image pair or correct the trusted publication.";
              core.setFailed(JSON.stringify({event: "runtime.failed", level: "error", ...common, stage, reference,
                expected: {source_sha: common.workflow_sha, proof_version: 2, platforms: ["linux/amd64", "linux/arm64"]},
                observed, provider_status: providerStatus, provider_error: providerError,
                cause: capture(error.code === "ERR_ASSERTION" ? error.message.split("\n")[0] : error.message, 16 * 1024),
                elapsed_ms: Date.now() - started, recovery}));
            }

  resolve:
    name: Resolve maintenance issues
    needs: runtime
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    outputs:
      runtime-image: ${{ needs.runtime.outputs.runtime-image }}
      issues: ${{ steps.route.outputs.issues }}
      has_work: ${{ steps.route.outputs.has_work }}
    steps:
      - name: Route through the pinned controller
        id: route
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ORM_RUNTIME_IMAGE: ${{ needs.runtime.outputs.runtime-image }}
          ORM_ISSUE_NUMBER: ${{ inputs.issue-number }}
          ORM_BOOTSTRAP_GITHUB_TOKEN: ${{ github.token }}
          ORM_CONFIGURATION_SECRETS: ${{ secrets.ORM_CONFIGURATION_SECRETS }}
          ORM_CONFIGURATION_VARIABLES: ${{ secrets.ORM_CONFIGURATION_VARIABLES }}
        with:
          script: |
            const assert = require("node:assert/strict");
            let secrets;
            try { secrets = JSON.parse(process.env.ORM_CONFIGURATION_SECRETS); }
            catch { throw new Error("Invalid configuration secret map."); }
            assert(secrets && typeof secrets === "object" && !Array.isArray(secrets) &&
              Object.values(secrets).every(value => typeof value === "string"), "Invalid configuration secret map.");
            let variables;
            try { variables = JSON.parse(process.env.ORM_CONFIGURATION_VARIABLES); }
            catch { throw new Error("Invalid configuration variable map."); }
            assert(variables && typeof variables === "object" && !Array.isArray(variables) &&
              Object.values(variables).every(value => typeof value === "string"), "Invalid configuration variable map.");
            const image = process.env.ORM_RUNTIME_IMAGE;
            assert(/^[a-z0-9][a-z0-9.-]*(?::[0-9]+)?(?:\/[a-z0-9][a-z0-9._-]*)+@sha256:[a-f0-9]{64}$/.test(image), "runtime-image must be pinned by digest.");
            core.info(JSON.stringify({event: "runtime.used", level: "info", repository: process.env.GITHUB_REPOSITORY,
              run_id: context.runId, attempt: Number(process.env.GITHUB_RUN_ATTEMPT), job: process.env.GITHUB_JOB,
              operation: "route", runtime_image: image}));
            const name = `orm-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}-route`;
            await exec.exec("docker", ["pull", image]);
            const environment = ["ORM_BOOTSTRAP_GITHUB_TOKEN", "ORM_CONFIGURATION_SECRETS", "ORM_CONFIGURATION_VARIABLES",
              "ORM_ISSUE_NUMBER", "GITHUB_REPOSITORY", "GITHUB_REPOSITORY_ID", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_EVENT_NAME", "GITHUB_REF"];
            await exec.exec("docker", ["create", "--name", name,
              "--label", `org.opensource-repo-manager.actions-run=${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`,
              "--mount", `type=bind,src=${process.env.GITHUB_EVENT_PATH},dst=/event.json,readonly`,
              "--env", "GITHUB_EVENT_PATH=/event.json", ...environment.flatMap(key => ["--env", key]),
              "--entrypoint", "/usr/bin/tini", image, "--", "/opt/orm-runtime/bin/node", "/opt/orm/app/dist/actions/controller.js", "route"]);
            const output = await exec.getExecOutput("docker", ["start", "--attach", name], {silent: true, ignoreReturnCode: true});
            if (output.stderr) core.info(output.stderr);
            assert(output.exitCode === 0, "Configuration or routing stopped; inspect configuration diagnostics.");
            const result = JSON.parse(output.stdout.trim());
            assert(result.version === 1 && result.repository_id === Number(process.env.GITHUB_REPOSITORY_ID) &&
              Array.isArray(result.issues) && result.issues.length <= 256 &&
              result.issues.every(number => Number.isSafeInteger(number) && number > 0) &&
              new Set(result.issues).size === result.issues.length, "Invalid routing result.");
            core.setOutput("issues", JSON.stringify(result.issues));
            core.setOutput("has_work", String(result.issues.length > 0));
      - name: Remove the routing container
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const assert = require("node:assert/strict");
            const name = `orm-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}-route`;
            const inspected = await exec.getExecOutput("docker", ["inspect", "--format",
              '{{index .Config.Labels "org.opensource-repo-manager.actions-run"}}', name], {silent: true, ignoreReturnCode: true});
            if (inspected.exitCode && /No such (object|container)/i.test(inspected.stderr)) return;
            assert(!inspected.exitCode && inspected.stdout.trim() === `${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`, "Routing container ownership is unverified.");
            await exec.exec("docker", ["stop", "--time", "15", name]);
            await exec.exec("docker", ["rm", "--volumes", name]);
            core.info(JSON.stringify({container: name, cleanup: "passed"}));

  maintenance:
    name: Maintain issue ${{ matrix.issue }}
    needs: resolve
    if: needs.resolve.outputs.has_work == 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        issue: ${{ fromJSON(needs.resolve.outputs.issues) }}
    concurrency:
      group: orm-${{ github.repository_id }}-issue-${{ matrix.issue }}
      cancel-in-progress: false
    steps:
      - name: Execute the bounded maintenance task
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ORM_RUNTIME_IMAGE: ${{ needs.resolve.outputs.runtime-image }}
          ORM_SELECTED_ISSUE: ${{ matrix.issue }}
          ORM_BOOTSTRAP_GITHUB_TOKEN: ${{ github.token }}
          ORM_CONFIGURATION_SECRETS: ${{ secrets.ORM_CONFIGURATION_SECRETS }}
          ORM_CONFIGURATION_VARIABLES: ${{ secrets.ORM_CONFIGURATION_VARIABLES }}
        with:
          script: |
            const assert = require("node:assert/strict");
            const image = process.env.ORM_RUNTIME_IMAGE, issue = process.env.ORM_SELECTED_ISSUE;
            let secrets;
            try { secrets = JSON.parse(process.env.ORM_CONFIGURATION_SECRETS); }
            catch { throw new Error("Invalid configuration secret map."); }
            assert(secrets && typeof secrets === "object" && !Array.isArray(secrets) &&
              Object.values(secrets).every(value => typeof value === "string"), "Invalid configuration secret map.");
            let variables;
            try { variables = JSON.parse(process.env.ORM_CONFIGURATION_VARIABLES); }
            catch { throw new Error("Invalid configuration variable map."); }
            assert(variables && typeof variables === "object" && !Array.isArray(variables) &&
              Object.values(variables).every(value => typeof value === "string"), "Invalid configuration variable map.");
            assert(/^[a-z0-9][a-z0-9.-]*(?::[0-9]+)?(?:\/[a-z0-9][a-z0-9._-]*)+@sha256:[a-f0-9]{64}$/.test(image), "runtime-image must be pinned by digest.");
            assert(/^[1-9][0-9]*$/.test(issue) && Number.isSafeInteger(Number(issue)), "Invalid selected issue.");
            core.info(JSON.stringify({event: "runtime.used", level: "info", repository: process.env.GITHUB_REPOSITORY,
              run_id: context.runId, attempt: Number(process.env.GITHUB_RUN_ATTEMPT), job: process.env.GITHUB_JOB,
              operation: "maintenance", issue_number: Number(issue), runtime_image: image}));
            const name = `orm-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}-issue-${issue}`;
            await exec.exec("docker", ["pull", image]);
            const environment = ["ORM_BOOTSTRAP_GITHUB_TOKEN", "ORM_CONFIGURATION_SECRETS", "ORM_CONFIGURATION_VARIABLES", "GITHUB_ACTIONS", "GITHUB_REPOSITORY",
              "GITHUB_REPOSITORY_ID", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_SHA", "ACTIONS_RUNTIME_TOKEN", "ACTIONS_RESULTS_URL"];
            assert(environment.every(key => process.env[key]), "Missing trusted Actions context or credentials.");
            await exec.exec("docker", ["create", "--name", name,
              "--label", `org.opensource-repo-manager.actions-run=${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`,
              ...environment.flatMap(key => ["--env", key]),
              "--entrypoint", "/usr/bin/tini", image, "--", "/opt/orm-runtime/bin/node", "/opt/orm/app/dist/actions/controller.js", "run", issue]);
            const output = await exec.getExecOutput("docker", ["start", "--attach", name], {silent: true, ignoreReturnCode: true});
            if (output.stderr) core.info(output.stderr);
            const result = JSON.parse(output.stdout.trim());
            assert(result.version === 1 && typeof result.outcome === "string", "Missing bounded-task result.");
            await core.summary.addHeading(`Maintenance issue ${issue}`).addCodeBlock(JSON.stringify(result, null, 2), "json").write();
            if (output.exitCode) core.setFailed(`Maintenance stopped: ${result.reason}`);
      - name: Remove the maintenance container
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ORM_SELECTED_ISSUE: ${{ matrix.issue }}
        with:
          script: |
            const assert = require("node:assert/strict");
            const issue = process.env.ORM_SELECTED_ISSUE;
            assert(/^[1-9][0-9]*$/.test(issue) && Number.isSafeInteger(Number(issue)), "Invalid cleanup issue.");
            const name = `orm-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}-issue-${issue}`;
            const inspected = await exec.getExecOutput("docker", ["inspect", "--format",
              '{{index .Config.Labels "org.opensource-repo-manager.actions-run"}}', name], {silent: true, ignoreReturnCode: true});
            if (inspected.exitCode && /No such (object|container)/i.test(inspected.stderr)) return;
            assert(!inspected.exitCode && inspected.stdout.trim() === `${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`, "Maintenance container ownership is unverified.");
            await exec.exec("docker", ["stop", "--time", "15", name]);
            await exec.exec("docker", ["rm", "--volumes", name]);
            core.info(JSON.stringify({container: name, cleanup: "passed"}));
