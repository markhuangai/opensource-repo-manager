version: 1
github:
  token: { from_secret: ORM_GITHUB_TOKEN }
session_key: { from_secret: ORM_SESSION_KEY }
proxy:
  url: { from_secret: PROXY_URL }
  key: { from_secret: ORM_PROXY_KEY }
profiles:
  coding:
    sdk: claude
    model: { from_variable: CODING_MODEL }
    effort: { from_variable: CODING_MODEL_EFFORT }
  review:
    sdk: codex
    model: { from_variable: REVIEW_MODEL }
    effort: { from_variable: REVIEW_MODEL_EFFORT }
roles:
  bootstrap:
    profile: coding
    prompts: { system: system.md, user: user.md }
    skills: [example, bootstrap]
  investigation:
    profile: coding
    prompts: { system: system.md, user: investigation.md }
    skills: [example, investigate]
  implementation:
    profile: coding
    prompts: { system: system.md, user: user.md }
    skills: [example, implement, review-feedback]
  audit:
    profile: review
    prompts: { system: system.md, user: user.md }
    skills: [example, bootstrap, audit]
  output_review:
    profile: review
    prompts: { system: system.md, user: user.md }
    skills: [example, output-review]
pr_monitor:
  enabled: true
  requirements_source: github
  automated_reviewers:
    - { login: "chatgpt-codex-connector[bot]", signal: codex }
    - { login: "coderabbitai[bot]", signal: coderabbit }
limits:
  active_minutes: 60
  model_requests: 200
  repair_cycles: 3
  infrastructure_retries: 2
  wait_hours: 24
