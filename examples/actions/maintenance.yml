name: Repository maintenance

# The pinned image defaults to one bounded Actions task; each invocation exits.

on:
  issues:
    types: [opened, edited, reopened, closed]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [synchronize, closed]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      issue-number:
        description: Existing issue to enroll or resume
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  maintenance:
    uses: markhuangai/opensource-repo-manager/.github/workflows/maintenance.yml@REPLACE_WITH_FULL_COMMIT_SHA
    with:
      runtime-image: ghcr.io/markhuangai/opensource-repo-manager@sha256:REPLACE_WITH_64_HEX_DIGEST
      runner: ubuntu-24.04
      issue-number: ${{ inputs.issue-number || '' }}
    secrets:
      ORM_CONFIGURATION_VARIABLES: ${{ toJSON(vars) }}
      ORM_CONFIGURATION_SECRETS: |
        {
          "ORM_GITHUB_TOKEN": ${{ toJSON(secrets.ORM_GITHUB_TOKEN) }},
          "ORM_PROXY_KEY": ${{ toJSON(secrets.ORM_PROXY_KEY) }},
          "ORM_SESSION_KEY": ${{ toJSON(secrets.ORM_SESSION_KEY) }},
          "PROXY_URL": ${{ toJSON(secrets.PROXY_URL) }}
        }
